<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ondam 프로젝트 콘솔</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>

<aside class="sidebar">
  <div class="brand">
    <div class="brand-mark"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8"><path d="M4 17V7l8-4 8 4v10l-8 4-8-4z"/><path d="M4 7l8 4 8-4"/><path d="M12 11v10"/></svg></div>
    <div>
      <div class="brand-text" id="brandText">ondam 콘솔</div>
      <div class="brand-sub">project console</div>
    </div>
  </div>
  <nav class="nav" id="nav"></nav>
  <div class="nav-status">
    <span class="dot" id="statusDot"></span>
    <span class="nav-status-text" id="statusText">연결 중...</span>
  </div>
</aside>

<div class="main">
  <div class="topbar">
    <div>
      <div class="crumb">ondam 콘솔</div>
      <div class="page-title" id="pageTitle">브리핑</div>
    </div>
    <div class="topbar-right">
      <span class="clock" id="clock">--:--:--</span>
    </div>
  </div>
  <div class="content" id="content"></div>
</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal-box">
    <div class="modal-head">
      <div class="modal-title" id="modalTitle"></div>
      <button class="modal-close" onclick="closeModal()" aria-label="닫기">&times;</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<script src="/app.js"></script>
</body>
</html>
