<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ONDAM 2.0 UI/UX Prototype</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@600;700&family=Noto+Sans+KR:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,400,0..1,0..200&display=block" />
<link rel="stylesheet" href="css/tokens.css" />
<link rel="stylesheet" href="css/shell.css" />
<link rel="stylesheet" href="css/components.css" />
</head>
<body>

<div id="landing">
  <div class="eyebrow"><span class="dot"></span> Design Prototype · Flutter 미반영</div>
  <h1>ONDAM 2.0<br>UI/UX Prototype</h1>
  <p>실제 Flutter 코드는 건드리지 않습니다. 이 HTML 프로토타입에서 화면을 확인하고 승인한 뒤에만 단계적으로 구현에 반영합니다.</p>
  <div class="landing-picker">
    <button class="app-pick senior" data-enter="senior">
      <div class="tag">App · 어르신용</div>
      <h2>Senior</h2>
      <p>쉬운 모드, 문서·문자 분석, 긴급 도움, 경로당 찾기</p>
      <div class="kw"><span>Simple</span><span>Large</span><span>Calm</span><span>Friendly</span></div>
    </button>
    <button class="app-pick guardian" data-enter="guardian">
      <div class="tag">App · 보호자용</div>
      <h2>Guardian</h2>
      <p>어르신 상태 요약, 위험 알림, 요금 통계, 연결 관리</p>
      <div class="kw"><span>Structured</span><span>Data</span><span>Efficient</span><span>Clear</span></div>
    </button>
  </div>
  <div class="stats-line" id="landingStats"></div>
</div>

<div id="workspace">
  <nav id="navigator">
    <div class="nav-top">
      <div class="nav-brand"><span class="title">ONDAM 2.0</span><button class="nav-back" data-exit>← 처음으로</button></div>
      <div class="app-switch">
        <button data-app-switch="senior">Senior</button>
        <button data-app-switch="guardian">Guardian</button>
      </div>
    </div>
    <div class="nav-search"><input id="navSearch" type="text" placeholder="화면 검색..." /></div>
    <div id="navScreens"></div>
  </nav>

  <div id="stage">
    <div id="stage-top">
      <div class="breadcrumb" id="breadcrumb"></div>
      <div class="frame-size">
        <button data-frame="360">360</button>
        <button data-frame="390" class="active">390</button>
        <button data-frame="430">430</button>
      </div>
    </div>
    <div id="stage-body">
      <div class="phone">
        <div class="phone-notch"></div>
        <div class="phone-screen w-390" id="phoneScreen" data-app="senior" data-easy="false">
          <div class="phone-statusbar">
            <span>9:41</span>
            <span class="icons"><span class="msi" style="font-size:13px">wifi</span><span class="msi" style="font-size:13px">battery_full</span></span>
          </div>
          <div class="state-tabs" id="stateTabs" style="display:none"></div>
          <div class="phone-content" id="phoneContent"></div>
        </div>
      </div>
    </div>
  </div>

  <aside id="devpanel"></aside>
</div>

<script src="js/data.js"></script>
<script src="js/templates.js"></script>
<script src="js/screens.senior.js"></script>
<script src="js/screens.guardian.js"></script>
<script src="js/app.js"></script>
</body>
</html>
