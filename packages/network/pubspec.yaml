name: ondam_network
description: >
  Shared Dio client, network exceptions, and error interceptor used by both
  the Senior and Guardian apps. Deliberately does not know about either
  app's AppConfig/.env — callers pass baseUrl in, so this package can't
  create a dependency from packages/ back onto apps/. Pure Dart — Dio does
  not require the Flutter SDK, and the Riverpod provider that wires this
  client to each app's own config lives in that app's `core/network/`.
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.12.2

resolution: workspace

dependencies:
  dio: ^5.11.0

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.0
