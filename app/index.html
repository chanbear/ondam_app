<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/ondam_app/app/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="어르신을 위한 문서·문자 확인 도우미">
  <meta name="theme-color" content="#3D6BF5">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="온담">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>온담</title>
  <link rel="manifest" href="manifest.json">

  <style>
    #a2hs-banner {
      display: none;
      position: fixed;
      left: 12px;
      right: 12px;
      bottom: calc(12px + env(safe-area-inset-bottom));
      z-index: 999999;
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.18);
      padding: 14px 14px 14px 16px;
      align-items: center;
      gap: 12px;
      font-family: -apple-system, "Noto Sans KR", sans-serif;
    }
    #a2hs-banner.visible { display: flex; }
    #a2hs-banner .a2hs-text { flex: 1; font-size: 14px; line-height: 1.4; color: #1B1D1F; }
    #a2hs-banner .a2hs-text b { color: #3D6BF5; }
    #a2hs-banner button {
      border: none; border-radius: 999px; font-weight: 700; font-size: 13px;
      padding: 10px 14px; cursor: pointer; white-space: nowrap;
    }
    #a2hs-banner .a2hs-add { background: #3D6BF5; color: #fff; }
    #a2hs-banner .a2hs-close {
      background: transparent; color: #9AA0A8; font-size: 18px; padding: 6px;
    }
  </style>
</head>
<body>
  <div id="a2hs-banner">
    <span class="a2hs-text" id="a2hsText"><b>홈 화면에 추가</b>하면 앱처럼 바로 열 수 있어요</span>
    <button class="a2hs-add" id="a2hsAdd">추가하기</button>
    <button class="a2hs-close" id="a2hsClose" aria-label="닫기">✕</button>
  </div>

  <script>
    // 브라우저 주소창 없이 '앱처럼' 쓰게 하려면 홈 화면 아이콘으로 여는
    // 방법뿐이다(사용자 요청 2026-08-30). 이미 standalone으로 실행 중이면
    // 아무것도 하지 않는다 — 이 배너는 '아직 브라우저 탭인' 최초 방문에만
    // 뜬다.
    (function () {
      var DISMISS_KEY = 'ondam_a2hs_dismissed';
      var isStandalone =
        window.matchMedia('(display-mode: standalone)').matches ||
        window.navigator.standalone === true;
      if (isStandalone) return;
      if (localStorage.getItem(DISMISS_KEY) === '1') return;

      var isIos = /iphone|ipad|ipod/i.test(window.navigator.userAgent);
      var banner = document.getElementById('a2hs-banner');
      var textEl = document.getElementById('a2hsText');
      var addBtn = document.getElementById('a2hsAdd');
      var closeBtn = document.getElementById('a2hsClose');
      var deferredPrompt = null;

      function dismiss() {
        banner.classList.remove('visible');
        localStorage.setItem(DISMISS_KEY, '1');
      }
      closeBtn.addEventListener('click', dismiss);

      if (isIos) {
        // iOS Safari에는 beforeinstallprompt가 없다 — 공유 메뉴 경로를
        // 직접 안내하는 수밖에 없다.
        textEl.innerHTML =
          '<b>홈 화면에 추가</b>하면 앱처럼 바로 열 수 있어요 — 하단 공유 버튼(⬆) → "홈 화면에 추가"';
        addBtn.style.display = 'none';
        banner.classList.add('visible');
        return;
      }

      window.addEventListener('beforeinstallprompt', function (e) {
        e.preventDefault();
        deferredPrompt = e;
        banner.classList.add('visible');
      });

      addBtn.addEventListener('click', function () {
        if (!deferredPrompt) return;
        deferredPrompt.prompt();
        deferredPrompt.userChoice.finally(function () {
          deferredPrompt = null;
          dismiss();
        });
      });

      window.addEventListener('appinstalled', dismiss);
    })();
  </script>

  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
