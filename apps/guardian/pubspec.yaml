name: ondam_guardian
description: "온담 보호자 앱"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

resolution: workspace

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.4.2
  go_router: ^17.5.0
  dio: ^5.11.0
  flutter_dotenv: ^6.0.1

  ondam_core:
    path: ../../packages/core
  ondam_models:
    path: ../../packages/models
  ondam_network:
    path: ../../packages/network
  ondam_design_system:
    path: ../../packages/design_system
  ondam_storage:
    path: ../../packages/storage
  supabase_flutter: ^2.17.1
  mobile_scanner: ^7.1.2
  permission_handler: 12.0.0
  firebase_core: ^4.13.0
  firebase_messaging: ^16.5.0
  flutter_local_notifications: ^22.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Direct dep (not just transitive via ondam_storage) so widget/auth tests
  # can call SharedPreferences.setMockInitialValues directly — same pattern
  # as apps/senior.
  shared_preferences: ^2.5.3
  mocktail: ^1.0.5

flutter:
  uses-material-design: true
