name: ondam_senior
description: "온담 어르신 앱"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

resolution: workspace

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.4.2
  go_router: ^17.5.0
  dio: ^5.11.0
  flutter_dotenv: ^6.0.1

  ondam_core:
    path: ../../packages/core
  ondam_models:
    path: ../../packages/models
  ondam_network:
    path: ../../packages/network
  ondam_design_system:
    path: ../../packages/design_system
  ondam_storage:
    path: ../../packages/storage

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Used directly (not just transitively via ondam_storage) in
  # test/core/easy_mode_provider_test.dart to seed SharedPreferences mocks.
  shared_preferences: ^2.5.3

flutter:
  uses-material-design: true
