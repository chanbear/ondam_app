name: ondam_senior
description: "온담 어르신 앱"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.4.2
  go_router: ^17.5.0
  flutter_dotenv: ^6.0.1

  ondam_core:
    path: ../../packages/core
  ondam_models:
    path: ../../packages/models
  ondam_design_system:
    path: ../../packages/design_system
  ondam_storage:
    path: ../../packages/storage
  supabase_flutter: ^2.17.1
  camera: ^0.12.0+2
  permission_handler: 12.0.0
  qr_flutter: ^4.1.0
  flutter_sms_inbox: ^1.0.5
  url_launcher: ^6.3.1
  speech_to_text: ^7.4.0
  flutter_tts: ^4.2.5
  geolocator: ^14.0.2
  geocoding: ^4.0.0
  image_picker: ^1.2.3
  share_plus: ^12.0.2
  cross_file: ^0.3.5
  http: ^1.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Used directly (not just transitively via ondam_storage) in
  # test/core/easy_mode_provider_test.dart to seed SharedPreferences mocks.
  shared_preferences: ^2.5.3
  mocktail: ^1.0.5

flutter:
  uses-material-design: true
  generate: true
  assets:
    - .env
    - assets/images/easy_result_illustration_doc.png
    - assets/images/easy_result_illustration_msg.png
    - assets/images/ondam_logo.png
